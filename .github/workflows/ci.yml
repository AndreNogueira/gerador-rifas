# Integracao continua. Em PULL REQUEST corre o essencial e barato: ruff, pytest em Linux (Python 3.15, a da webapp E a da app Windows desde a 2.5)
# e o frontend React (Biome, tsc, Vitest, build). Em PUSH para main (e num PR com a etiqueta «completo») corre tudo: tambem pytest em Windows,
# as metricas em Postgres, o e2e (Playwright) e a imagem Docker (cujo alvo `testes` repete o pytest e o Vitest dentro do contentor).
# Porque: o plano gratuito do GitHub (2000 min/mes em repositorios privados; os minutos de Windows contam o dobro) acabou-se com 9 trabalhos por
# push. Um PR so de documentacao nao corre CI (paths-ignore). O que o CI economiza num PR corre-se localmente: `scripts/verificar.ps1 -Docker -E2e`.
# O deploy (deploy.yml) so corre depois de este CI passar em main.
# Nota: `astral-sh/setup-uv` ja nao publica a tag flutuante `v10` (so versoes exatas); as outras Actions usam a tag major.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]       # `labeled`: a etiqueta «completo» corre tudo
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "app/assets/**"          # videos e capturas: o que os usa e testado por tests/test_assets_publicados.py (corre em qualquer PR que mexa em codigo)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.15"
      - run: uv sync --frozen
      - run: uv run --no-sync ruff check . --output-format github

  testes:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'completo')) && fromJSON('["ubuntu-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
        python: ["3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run --no-sync python -m pytest -q
      - name: Auto-teste do motor (python -m core)
        working-directory: src
        env:
          PYTHONIOENCODING: utf-8
        run: uv run --no-sync python -m core ../app/exemplos ${{ runner.temp }}/autoteste

  # As metricas na base Postgres (DATABASE_URL): as mesmas consultas do painel contra um Postgres a sério (o SQLite e o Postgres nao podem divergir).
  # Num trabalho a parte porque os contentores de servico so existem em runners Linux.
  postgres:
    name: metricas em Postgres 17
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'completo')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: teste          # base descartavel do CI, so acessivel dentro do trabalho
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:teste@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.15"
      - run: uv sync --frozen
      - run: uv run --no-sync python -m pytest -q tests/test_web_metricas.py tests/test_web_metricas_bd.py tests/test_web_partilhas.py -rs

  frontend:
    name: frontend (Node 26, pnpm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: src/web/frontend/package.json   # a versao do pnpm vem do campo packageManager
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: src/web/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run tipos
      - run: pnpm run teste
      - run: pnpm run build

  e2e:
    name: e2e (Playwright, Chromium)
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'completo')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.15"
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: src/web/frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: src/web/frontend/pnpm-lock.yaml
      - run: uv sync --frozen
      - name: Compilar o frontend (o que o FastAPI serve)
        working-directory: src/web/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Instalar o Chromium do Playwright
        working-directory: src/web/frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Testes e2e (a app compilada num browser a sério)
        working-directory: src/web/frontend
        run: pnpm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: resultados-e2e
          path: src/web/frontend/test-results/
          retention-days: 7

  docker:
    name: imagem Docker (testes dentro do build)
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'completo')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target testes -t gerador-rifas-testes .
      - run: docker build --target web -t gerador-rifas .
