<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#6a35f5" />
    <title>Gerador de Rifas</title>
    <link rel="icon" href="/icone.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icone-apple.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // aplica o tema e o modo guardados antes de a página pintar (o React confirma-os depois)
      try {
        var raiz = document.documentElement;
        var visual = localStorage.getItem("rifas.visual");
        var modo = localStorage.getItem("rifas.tema");
        if (visual) raiz.setAttribute("data-visual", visual);
        if (modo === "claro" || modo === "escuro") raiz.setAttribute("data-tema", modo === "claro" ? "light" : "dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
