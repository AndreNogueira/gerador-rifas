# Blueprint do Render: cria o servico a partir da imagem publicada pelo deploy.yml no ghcr.io (ver README.md, «CI/CD»).
# Render -> New -> Blueprint -> escolher este repositorio. As credenciais para puxar a imagem privada NAO ficam aqui:
# criam-se no painel (Workspace Settings -> Registry Credentials) com o nome «ghcr».
# Servico PUBLICO e sem palavra-passe (decisao de 2026-11-07; mais tarde sera pago). A porta vem do Render (PORT) e o HOST=0.0.0.0 da imagem.
services:
  - type: web
    name: gerador-rifas
    runtime: image
    plan: free
    region: frankfurt
    healthCheckPath: /health
    image:
      url: ghcr.io/andrenogueira/gerador-rifas:latest
      creds:
        fromRegistryCreds:
          name: ghcr
    envVars:
      # A palavra-passe do painel de administracao (/admin). NAO tem valor aqui: o Blueprint pede-a no painel do Render
      # (e num servico que ja existe define-se em Environment). Sem ela (ou com menos de 12 caracteres) o painel nao existe.
      - key: ADMIN_TOKEN
        sync: false
      # O endereco da base Postgres (Neon) para as metricas sobreviverem a reinicios. NAO tem valor aqui: define-se em Environment. Sem ele
      # as metricas ficam no disco efemero, como antes.
      - key: DATABASE_URL
        sync: false
