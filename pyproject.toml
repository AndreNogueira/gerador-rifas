[project]
name = "gerador-rifas"
version = "0.1.0"
description = "Gerador de Rifas: motor (src/core) usado pela app Windows (app/) e pela webapp (src/web: API FastAPI + frontend React)"
requires-python = ">=3.13"     # o core ainda corre em 3.13, mas a webapp, a app Windows (desde a 2.5) e os testes usam a 3.15 (.python-version)
dependencies = [
    "pypdf",
    "pypdfium2",
    "pillow",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx2",      # usado pelo starlette.testclient (testes da API); o antigo `httpx` esta obsoleto no Starlette 1.x
    "ruff",         # lint (CI)
]

web = [
    "fastapi",
    "uvicorn",
    "psutil>=7.2.2",
    "segno",              # o QR de cada bilhete (core/qr.py): puro Python, sem dependencias
    "reportlab",          # a galeria de templates (core/galeria.py) cria os PDFs; tambem serve os testes (PDFs sinteticos)
    "psycopg[binary]>=3.3.8",
]

[tool.uv]
default-groups = ["dev", "web"]
package = false    # nao e uma biblioteca instalavel: src/ e posto no caminho pelo pytest.ini (pythonpath) e pela app

[tool.ruff]
# Lint do codigo novo e do motor: `app/` (interface Tk, ja validada pelo --selftest) fica de fora.
src = ["src"]
extend-exclude = ["app", "final", "saida"]

[tool.ruff.lint]
# Erros de sintaxe/execucao e pyflakes (imports e variaveis por usar, nomes indefinidos).
select = ["E4", "E7", "E9", "F"]
# Estilo do motor ja existente, sem risco: nomes de uma letra (`l`), varios comandos por linha, lambda atribuida.
ignore = ["E741", "E702", "E731"]
